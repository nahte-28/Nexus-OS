[package]
name = "nexus-desktop"
version = "1.0.0"
description = "NEXUS OS for Windows and Linux"
edition = "2021"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": several webviews in one window, for the NEXUS Browser (toolbar + tabs).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
# "deep-link": a second launch with a nexus:// link passes the link to the running app (deeplink.rs).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
# Ctrl+Shift+Space opens Snelle notitie from any program (shortcut.rs).
tauri-plugin-global-shortcut = "2"
# Self-update: finds the newest installer on GitHub releases and downloads it (Windows TLS via schannel, OpenSSL on Linux).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
# Checks that a downloaded update was signed by the release pipeline (signature.rs).
ed25519-dalek = "2"
