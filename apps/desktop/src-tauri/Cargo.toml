[package]
name = "nexus-desktop"
version = "1.0.0"
description = "NEXUS OS for Windows"
edition = "2021"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Self-update: finds the newest installer on GitHub releases and downloads it (Windows TLS via schannel).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
