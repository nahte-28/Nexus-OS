name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    # The built app in a real browser, as a computer and as a phone: every app, accessibility,
    # offline and the main scenarios (apps/web/e2e).
    # Playwright 1.56 has no browsers for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @nexus/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-traces
          path: apps/web/test-results/
          retention-days: 7

  database:
    # Every migration on a fresh Postgres, then the row-level security tests (supabase/tests).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh postgresql://postgres:postgres@localhost:5432/postgres

  sync:
    # Two devices on one account against a real local Supabase (Auth, PostgREST, Realtime, every
    # migration): a change shows on the other device through realtime, edits on both merge, and
    # another account sees nothing (apps/web/src/sync/twoDevices.supabase.ts).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Start a local Supabase with every migration
        run: supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Two-device sync test
        run: |
          # The local stack's own demo keys, not the live project's.
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" npm run test:sync -w @nexus/web
      - if: failure()
        run: supabase status && docker ps -a
